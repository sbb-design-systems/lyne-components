tcp_nopush          on;
tcp_nodelay         on;
types_hash_max_size 2048;

# Suppresses the nginx version in the Server header.
server_tokens off;

js_import docs.js;

server {
  listen       8080 default_server;
  server_name  _;
  root         /usr/share/nginx/html;
  index index.html index.htm;

  location / {
    js_content docs.spa;
  }
}
